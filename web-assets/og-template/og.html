<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Pretendard Variable";
        src: url("../../public/fonts/PretendardVariable.woff2") format("woff2-variations");
        font-weight: 45 920;
      }
      /* 색은 src/styles/tokens.css와 일치: --primary #00648f, --background #ffffff */
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
      }
      body {
        display: flex;
        align-items: center;
        gap: 56px;
        padding: 0 96px;
        box-sizing: border-box;
        background: #ffffff;
        font-family: "Pretendard Variable", sans-serif;
        color: #1a1a1a;
        border-bottom: 16px solid #00648f;
      }
      img {
        width: 220px;
        height: 220px;
        flex: none;
      }
      h1 {
        margin: 0 0 20px;
        font-size: 96px;
        font-weight: 800;
        letter-spacing: -2px;
        color: #00648f;
      }
      p {
        margin: 0;
        font-size: 40px;
        font-weight: 500;
        line-height: 1.35;
        color: #3d3d3d;
      }
    </style>
  </head>
  <body>
    <img src="../logo-source/logo.svg" alt="" />
    <div>
      <h1>머물전남.</h1>
      <p>전남 축제와 가고 싶은 장소로<br />만드는 여행 일정</p>
    </div>
  </body>
</html>
